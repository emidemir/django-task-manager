# This file tells Nginx how to direct traffic between React and Django
server {
    listen 80;
    server_name _;

    # 1. Serve the React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This try_files is CRITICAL for React Router to work properly without giving 404 errors
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Django Backend
    location /api/ {
        # 'django_backend' is the service name we will put in docker-compose.yml
        proxy_pass http://django_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy Admin panel requests to the Django Backend
    location /admin/ {
        proxy_pass http://django_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy WebSockets (If you are using Django Channels / Real-time features)
    location /ws/ {
        proxy_pass http://django_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    
    # 5. Serve Django Static/Media files (Optional but recommended for production)
    # location /static/ {
    #     alias /app/backend/staticfiles/;
    # }
    # location /media/ {
    #     alias /app/backend/media/;
    # }
}